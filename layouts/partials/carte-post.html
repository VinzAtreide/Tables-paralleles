{{ $s := index (.GetTerms "serie") 0 }}
<a class="carte-post {{ with $s }}s-{{ .Page.Slug | default (path.Base .Page.RelPermalink) }}{{ end }}" href="{{ .RelPermalink }}">
  <span class="meta">{{ .Date | time.Format ":date_long" }}{{ with $s }} · {{ .LinkTitle }}{{ end }}</span>
  <h3>{{ .Title }}</h3>
  <p>{{ .Description }}</p>
</a>
