{{ $s := index (.GetTerms "serie") 0 }}
<a class="carte-post {{ with $s }}s-{{ path.Base .Page.RelPermalink }}{{ end }}" href="{{ .RelPermalink }}">
  <span class="meta">{{ .Date | time.Format ":date_long" }}{{ with $s }} · {{ .LinkTitle }}{{ end }} · {{ .ReadingTime }} min</span>
  <h3>{{ .Title }}</h3>
  <p>{{ .Description }}</p>
</a>
