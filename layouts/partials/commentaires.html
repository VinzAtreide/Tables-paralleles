{{ if site.Params.giscusRepoId }}
<section class="commentaires">
  <h2 id="commentaires">Commentaires</h2>
  <p class="meta">Réagir demande un compte GitHub (gratuit). Modéré par l'auteur.</p>
  <script src="https://giscus.app/client.js"
    data-repo="VinzAtreide/Tables-paralleles"
    data-repo-id="{{ site.Params.giscusRepoId }}"
    data-category="Commentaires"
    data-category-id="{{ site.Params.giscusCategoryId }}"
    data-mapping="pathname"
    data-strict="1"
    data-reactions-enabled="1"
    data-emit-metadata="0"
    data-input-position="top"
    data-theme="{{ "giscus-clair.css" | absURL }}"
    data-lang="fr"
    data-loading="lazy"
    crossorigin="anonymous"
    async>
  </script>
</section>
{{ end }}
