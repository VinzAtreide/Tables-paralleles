{{ define "main" }}
<div class="colonne liste-posts">
<h1>{{ .Title }}</h1>
{{ .Content }}
{{ range .Pages.ByTitle }}
<a class="carte-post" href="{{ .RelPermalink }}">
  <span class="meta">{{ .Params.etat | default "idée" }}</span>
  <h3>{{ .Title }}</h3>
  <p>{{ .Description }}</p>
</a>
{{ end }}
</div>
{{ end }}
