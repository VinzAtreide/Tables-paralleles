{{ define "main" }}
<div class="colonne liste-posts">
<h1>Les séries</h1>
{{ range .Data.Terms.Alphabetical }}
<a class="carte-post" href="{{ .Page.RelPermalink }}">
  <h3>{{ .Page.Title }}</h3>
  <p>{{ .Page.Params.resume }} · {{ .Count }} carnet{{ if gt .Count 1 }}s{{ end }}</p>
</a>
{{ end }}
</div>
{{ end }}
